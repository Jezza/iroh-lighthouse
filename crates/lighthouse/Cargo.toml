[package]
name = "iroh-lighthouse"
description = "Topic rendezvous and address lookup for iroh nodes via a lighthouse server reachable by URL or over iroh"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
iroh.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
postcard.workspace = true
blake3.workspace = true
thiserror.workspace = true
tracing.workspace = true
url.workspace = true
n0-future.workspace = true
n0-watcher.workspace = true
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
clap = { workspace = true, optional = true }
humantime = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
anyhow = { version = "1", optional = true }
distributed-topic-tracker = { version = "0.3", default-features = false, optional = true }
ed25519-dalek = { version = "3.0.0-rc.0", optional = true }
tokio-util = { version = "0.7", default-features = false, optional = true }

[features]
cli = ["dep:clap", "dep:humantime", "dep:tracing-subscriber", "dep:anyhow", "tokio/rt-multi-thread", "tokio/signal"]
# Serverless bootstrap over the BitTorrent mainline DHT, used when the
# lighthouse itself is unreachable. Off by default: it pulls in a DHT stack and
# talks to a public network, which is a decision a user should opt into.
dht-fallback = ["dep:distributed-topic-tracker", "dep:ed25519-dalek", "dep:tokio-util"]

[[bin]]
name = "lighthouse"
required-features = ["cli"]
path = "src/bin/lighthouse.rs"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
