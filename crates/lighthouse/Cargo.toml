[package]
name = "iroh-lighthouse"
description = "Topic rendezvous and address lookup server for iroh nodes: HTTP and iroh carriers over one protocol"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "lighthouse"
path = "src/main.rs"

[dependencies]
iroh-lighthouse-protocol.workspace = true
iroh.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
humantime.workspace = true
n0-future.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }

[dev-dependencies]
iroh-lighthouse-client.workspace = true
tokio = { workspace = true, features = ["full"] }
tempfile = "3"
url.workspace = true
